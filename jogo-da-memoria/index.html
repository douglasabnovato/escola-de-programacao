
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memory Nexus | learnTECH</title>
    <style>
        /* DESIGN SYSTEM NEXUS */
        :root {
            --corAzul: #199bd9;
            --corVermelho: #e62319;
            --corAmarelo: #fccf2f;
            --corVerde: #44af35;
            --corFundo: #0d0d0d;
        }

        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: var(--corFundo);
            color: white;
            font-family: "Lato", sans-serif;
        }

        .header-nexus {
            margin-bottom: 30px;
            text-align: center;
        }

        .header-nexus h1 {
            font-size: 2.5rem;
            color: var(--corAzul);
            text-transform: uppercase;
            letter-spacing: 5px;
            text-shadow: 2px 2px var(--corAmarelo);
        }

        /* TABULEIRO NEXUS */
        .memory-game {
            width: 640px;
            height: 640px;
            display: flex;
            flex-wrap: wrap;
            perspective: 1000px;
            background: rgba(25, 155, 217, 0.1);
            padding: 10px;
            border: 4px solid var(--corAzul);
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(252, 207, 47, 0.3);
        }

        .memory-card {
            width: calc(25% - 10px);
            height: calc(33.333% - 10px);
            margin: 5px;
            position: relative;
            transform: scale(1);
            transform-style: preserve-3d;
            transition: transform .5s;
            cursor: pointer;
        }

        .memory-card:active {
            transform: scale(0.97);
            transition: transform .2s;
        }

        .memory-card.flip {
            transform: rotateY(180deg);
        }

        /* FACES DAS CARTAS NEXUS */
        .front-face,
        .back-face {
            width: 100%;
            height: 100%;
            padding: 15px;
            position: absolute;
            border-radius: 8px;
            backface-visibility: hidden;
            border: 2px solid var(--corAzul);
        }

        .back-face {
            background: var(--corAzul); /* Cor sólida Nexus */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .front-face {
            background: #fff;
            transform: rotateY(180deg);
        }

        img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <header class="header-nexus">
        <h1>Memory Nexus</h1>
    </header>

    <main class="memory-game">
        <div class="memory-card" data-framework="aurelia">
            <img class="front-face" src="img/aurelia.svg" alt="Aurelia" />
            <div class="back-face"><img src="img/js-badge.svg" alt="JS"></div>
        </div>
        <div class="memory-card" data-framework="aurelia">
            <img class="front-face" src="img/aurelia.svg" alt="Aurelia" />
            <div class="back-face"><img src="img/js-badge.svg" alt="JS"></div>
        </div>

        <div class="memory-card" data-framework="vue">
            <img class="front-face" src="img/vue.svg" alt="Vue" />
            <div class="back-face"><img src="img/js-badge.svg" alt="JS"></div>
        </div>
        <div class="memory-card" data-framework="vue">
            <img class="front-face" src="img/vue.svg" alt="Vue" />
            <div class="back-face"><img src="img/js-badge.svg" alt="JS"></div>
        </div>

        <div class="memory-card" data-framework="angular">
            <img class="front-face" src="img/angular.svg" alt="Angular" />
            <div class="back-face"><img src="img/js-badge.svg" alt="JS"></div>
        </div>
        <div class="memory-card" data-framework="angular">
            <img class="front-face" src="img/angular.svg" alt="Angular" />
            <div class="back-face"><img src="img/js-badge.svg" alt="JS"></div>
        </div>

        <div class="memory-card" data-framework="ember">
            <img class="front-face" src="img/ember.svg" alt="Ember" />
            <div class="back-face"><img src="img/js-badge.svg" alt="JS"></div>
        </div>
        <div class="memory-card" data-framework="ember">
            <img class="front-face" src="img/ember.svg" alt="Ember" />
            <div class="back-face"><img src="img/js-badge.svg" alt="JS"></div>
        </div>

        <div class="memory-card" data-framework="backbone">
            <img class="front-face" src="img/backbone.svg" alt="Backbone" />
            <div class="back-face"><img src="img/js-badge.svg" alt="JS"></div>
        </div>
        <div class="memory-card" data-framework="backbone">
            <img class="front-face" src="img/backbone.svg" alt="Backbone" />
            <div class="back-face"><img src="img/js-badge.svg" alt="JS"></div>
        </div>

        <div class="memory-card" data-framework="react">
            <img class="front-face" src="img/react.svg" alt="React" />
            <div class="back-face"><img src="img/js-badge.svg" alt="JS"></div>
        </div>
        <div class="memory-card" data-framework="react">
            <img class="front-face" src="img/react.svg" alt="React" />
            <div class="back-face"><img src="img/js-badge.svg" alt="JS"></div>
        </div>
    </main>

    <script>
        /**
         * LÓGICA MEMORY NEXUS
         */
        const cards = document.querySelectorAll(".memory-card");

        let hasFlippedCard = false;
        let lockBoard = false;
        let firstCard, secondCard;

        function flipCard() {
            if (lockBoard) return;
            if (this === firstCard) return;

            this.classList.add("flip");

            if (!hasFlippedCard) {
                hasFlippedCard = true;
                firstCard = this;
                return;
            }

            secondCard = this;
            checkForMatch();
        }

        function checkForMatch() {
            let isMatch = firstCard.dataset.framework === secondCard.dataset.framework;
            isMatch ? disableCards() : unflipCards();
        }

        function disableCards() {
            firstCard.removeEventListener("click", flipCard);
            secondCard.removeEventListener("click", flipCard);
            resetBoard();
        }

        function unflipCards() {
            lockBoard = true;
            setTimeout(() => {
                firstCard.classList.remove("flip");
                secondCard.classList.remove("flip");
                resetBoard();
            }, 1000); // Tempo reduzido para 1s para melhor UX Nexus
        }

        function resetBoard() {
            [hasFlippedCard, lockBoard] = [false, false];
            [firstCard, secondCard] = [null, null];
        }

        (function shuffle() {
            cards.forEach((card) => {
                let randomPos = Math.floor(Math.random() * 12);
                card.style.order = randomPos;
            });
        })();

        cards.forEach((card) => card.addEventListener("click", flipCard));
    </script>
</body>
</html>
