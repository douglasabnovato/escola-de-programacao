<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>LearnTECH Nexus | Hub de Projetos</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <style>
      /* ==========================================================================
           PROJECT: Nexus Hub | LearnTECH (Pai de Todos)
           DESIGN: Modern Bento Grid + Extreme Responsiveness
           AUTHOR: Douglas A B Novato
           ========================================================================== */
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap");

      :root {
        --primary: #ff5722;
        --primary-dark: #d84315;
        --bg: #080808;
        --surface: #121212;
        --card: #1c1c1c;
        --text-main: #f0f0f0;
        --text-dim: #a0a0a0;
        --border-glass: rgba(255, 255, 255, 0.05);
        --shadow-neon: 0 0 20px rgba(255, 87, 34, 0.12);
        --transition-smooth: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        --header-height: 70px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Inter", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      body {
        background-color: var(--bg);
        color: var(--text-main);
        overflow-x: hidden;
        line-height: 1.6;
      }

      /* Scrollbar Customizada */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: var(--bg);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border-glass);
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--primary);
      }

      /* Header Flutuante */
      .app-header {
        background: rgba(8, 8, 8, 0.85);
        backdrop-filter: blur(15px);
        padding: 0 2rem;
        border-bottom: 1px solid var(--border-glass);
        position: fixed;
        top: 0;
        width: 100%;
        height: var(--header-height);
        z-index: 100;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .brand h1 {
        font-size: 1.3rem;
        font-weight: 800;
        letter-spacing: -1px;
      }
      .brand span {
        color: var(--primary);
        text-shadow: 0 0 10px rgba(255, 87, 34, 0.3);
      }

      /* Conteúdo Principal */
      .hub-content {
        padding: calc(var(--header-height) + 2.5rem) 2rem 4rem;
        max-width: 1400px;
        margin: 0 auto;
      }

      /* Contador Dinâmico */
      #nexus-counter-container {
        margin-bottom: 2rem;
        padding: 0 0.5rem;
      }
      #project-count-text {
        font-size: 1rem;
        color: var(--text-dim);
        font-weight: 500;
      }

      /* Grid Bento Responsiva */
      .bento-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        grid-auto-rows: 280px;
        gap: 1.5rem;
      }

      /* Card Base */
      .project-card {
        background: var(--card);
        border: 1px solid var(--border-glass);
        border-radius: 24px;
        padding: 2rem;
        cursor: pointer;
        transition: var(--transition-smooth);
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
      }

      .project-card:hover {
        transform: translateY(-8px);
        border-color: var(--primary);
        box-shadow: var(--shadow-neon);
      }

      /* Lógica de Cards Destaque (Featured) */
      .project-card.featured {
        grid-column: span 2;
        grid-row: span 2;
        background-size: cover;
        background-position: center;
      }

      .project-card.featured::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          to bottom,
          rgba(8, 8, 8, 0.1) 0%,
          rgba(8, 8, 8, 0.95) 90%
        );
        z-index: 1;
      }

      .project-card.featured .card-content,
      .project-card.featured .card-icon,
      .project-card.featured .badge {
        z-index: 2;
      }

      /* Elementos Internos do Card */
      .card-icon {
        font-size: 2.2rem;
        color: var(--primary);
        margin-bottom: 1rem;
        position: absolute;
        top: 2rem;
        left: 2rem;
      }
      .project-card h3 {
        font-size: 1.25rem;
        font-weight: 700;
        margin-bottom: 0.5rem;
      }
      .project-card p {
        font-size: 0.9rem;
        color: var(--text-dim);
        max-width: 90%;
      }
      .badge {
        background: rgba(255, 255, 255, 0.05);
        color: var(--text-dim);
        padding: 5px 14px;
        border-radius: 30px;
        font-size: 0.7rem;
        font-weight: 700;
        position: absolute;
        top: 2rem;
        right: 2rem;
      }

      /* Viewer Imersivo */
      #project-viewer {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: var(--bg);
        z-index: 1000;
        display: none;
        flex-direction: column;
      }

      .viewer-header {
        height: 70px;
        padding: 0 2rem;
        background: var(--surface);
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--border-glass);
      }

      /* Loader de Carregamento (UX) */
      #viewer-progress {
        position: absolute;
        top: 69px;
        left: 0;
        height: 2px;
        background: var(--primary);
        width: 0%;
        transition: 0.3s;
        z-index: 1001;
      }

      .back-btn {
        background: var(--primary);
        color: #fff;
        border: none;
        padding: 10px 20px;
        border-radius: 12px;
        cursor: pointer;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      iframe {
        flex-grow: 1;
        border: none;
        width: 100%;
        background: #fff;
      }

      /* ==========================================================================
           RESPONSIVIDADE (MOBILE-FIRST STRATEGY)
           ========================================================================== */
      @media (max-width: 1024px) {
        .bento-grid {
          grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        }
      }

      @media (max-width: 768px) {
        .app-header {
          padding: 0 1.2rem;
        }
        .hub-content {
          padding: calc(var(--header-height) + 1.5rem) 1.2rem 3rem;
        }
        .project-card.featured {
          grid-column: span 1;
          grid-row: span 1;
          height: 320px;
        }
        .bento-grid {
          grid-template-columns: 1fr;
          grid-auto-rows: auto;
          min-height: 250px;
        }
        .project-card {
          padding: 1.5rem;
          height: 280px;
        }
        .card-icon {
          font-size: 1.8rem;
          top: 1.5rem;
          left: 1.5rem;
        }
        .badge {
          top: 1.5rem;
          right: 1.5rem;
        }
      }

      /* Ajuste para telas muito pequenas */
      @media (max-width: 480px) {
        .brand h1 {
          font-size: 1.1rem;
        }
        .back-btn span {
          display: none;
        } /* Esconde texto do botão no mobile ultra-small */
      }
    </style>
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <h1>Learn<span>TECH</span> Nexus</h1>
      </div>
    </header>

    <main class="hub-content">
      <div id="nexus-counter-container">
        <h2 id="project-count-text">Calculando projetos...</h2>
      </div>

      <div class="bento-grid" id="main-grid"></div>
    </main>

    <div id="project-viewer">
      <div id="viewer-progress"></div>
      <div class="viewer-header">
        <span id="project-title-display" style="font-weight: 700">Projeto</span>
        <button class="back-btn" onclick="closeProject()">
          <i class="fas fa-arrow-left"></i> <span>Voltar ao Nexus</span>
        </button>
      </div>
      <iframe id="project-iframe" src=""></iframe>
    </div>

    <script>
      const NexusEngine = {
        jsonPath: "./projects.json",
        container: document.getElementById("main-grid"),
        counter: document.getElementById("project-count-text"),
        viewer: document.getElementById("project-viewer"),
        iframe: document.getElementById("project-iframe"),
        progress: document.getElementById("viewer-progress"),
        titleDisplay: document.getElementById("project-title-display"),
      };

      async function initNexus() {
        try {
          const response = await fetch(NexusEngine.jsonPath);
          if (!response.ok) throw new Error("Falha no fetch");
          const projects = await response.json();

          // 1. Atualiza Contador Dinâmico
          NexusEngine.counter.innerHTML = `Conheça nossos <span style="color:var(--primary); font-weight:800;">${projects.length}</span> projetos`;

          // 2. Renderiza Grid
          NexusEngine.container.innerHTML = projects
            .map((p) => renderNexusCard(p))
            .join("");

          // 3. Persistência
          checkPersistedState(projects);
        } catch (err) {
          console.error("Nexus Error:", err);
          NexusEngine.container.innerHTML = `<p style="grid-column:1/-1; text-align:center; color:var(--primary);">Erro ao sincronizar projetos.</p>`;
        }
      }

      function renderNexusCard(p) {
        const isFeatured = p.featured;
        const style =
          isFeatured && p.image
            ? `style="background-image: url('${p.image}');"`
            : "";

        return `
          <div class="project-card ${isFeatured ? "featured" : ""}" ${style} 
               onclick="openProject('${p.title}', '${p.path}')">
            <i class="${p.icon} card-icon"></i>
            <span class="badge">${p.category}</span>
            <div class="card-content">
              <h3>${p.title}</h3>
              <p>${p.description}</p>
            </div>
          </div>
        `;
      }

      window.openProject = (title, url) => {
        NexusEngine.titleDisplay.innerText = title;
        NexusEngine.iframe.src = url;
        NexusEngine.viewer.style.display = "flex";
        document.body.style.overflow = "hidden";

        // UX: Simulação de progresso
        NexusEngine.progress.style.width = "40%";
        NexusEngine.iframe.onload = () => {
          NexusEngine.progress.style.width = "100%";
          setTimeout(() => (NexusEngine.progress.style.width = "0%"), 300);
        };

        localStorage.setItem("nexus_last_view", JSON.stringify({ title, url }));
        window.history.pushState(null, null, `#${encodeURIComponent(title)}`);
      };

      window.closeProject = () => {
        NexusEngine.viewer.style.display = "none";
        NexusEngine.iframe.src = "";
        document.body.style.overflow = "auto";
        localStorage.removeItem("nexus_last_view");
        window.history.pushState(null, null, window.location.pathname);
      };

      function checkPersistedState(projects) {
        const saved = localStorage.getItem("nexus_last_view");
        if (saved) {
          const { title, url } = JSON.parse(saved);
          openProject(title, url);
        } else if (window.location.hash) {
          const hash = decodeURIComponent(window.location.hash.substring(1));
          const match = projects.find((p) => p.title === hash);
          if (match) openProject(match.title, match.path);
        }
      }

      document.addEventListener("DOMContentLoaded", initNexus);
    </script>
  </body>
</html>
