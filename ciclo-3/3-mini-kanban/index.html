<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Kanban</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link rel="stylesheet" href="./src/assets/css/style.css" />
  </head>
  <body>
    <div class="app-container">
      <header class="app-header">
        <div class="brand">
          <h1>Mini<span>Kanban</span></h1>
          <p>Agile Task Manager</p>
        </div>
      </header>

      <main class="kanban-board">
        <section class="column">
          <div class="column-header">
            <h3><i class="fas fa-list-ul"></i> À Fazer</h3>
            <span class="count" id="count-todo">0</span>
          </div>
          <ul
            id="todo"
            class="task-list"
            ondrop="drop(event)"
            ondragover="allowDrop(event)"
          ></ul>
          <div class="add-action" onclick="showInput(this)">
            <i class="fas fa-plus"></i> Adicionar tarefa
          </div>
        </section>

        <section class="column">
          <div class="column-header">
            <h3><i class="fas fa-spinner fa-spin"></i> Fazendo</h3>
            <span class="count" id="count-doing">0</span>
          </div>
          <ul
            id="doing"
            class="task-list"
            ondrop="drop(event)"
            ondragover="allowDrop(event)"
          ></ul>
          <div class="add-action" onclick="showInput(this)">
            <i class="fas fa-plus"></i> Adicionar tarefa
          </div>
        </section>

        <section class="column">
          <div class="column-header">
            <h3><i class="fas fa-check-double"></i> Feito</h3>
            <span class="count" id="count-done">0</span>
          </div>
          <ul
            id="done"
            class="task-list"
            ondrop="drop(event)"
            ondragover="allowDrop(event)"
          ></ul>
          <div class="add-action" onclick="showInput(this)">
            <i class="fas fa-plus"></i> Adicionar tarefa
          </div>
        </section>
      </main>

      <footer class="app-footer">
        <div class="footer-content">
          <p>
            &copy; 2026 byteclass Software House. Todos os direitos reservados.
          </p>
          <div class="status">
            System Status: <span class="pulse"></span> Online
          </div>
        </div>
      </footer>
    </div>
    <script src="./src/assets/js/script.js"></script>
  </body>
</html>
