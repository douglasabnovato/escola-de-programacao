<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aula 21 - Entendendo APIs | ByteClass</title>
    <style>
      :root {
        --primary: #6366f1;
        --secondary: #a855f7;
        --bg: #0f172a;
        --card: #1e293b;
        --text: #f8fafc;
      }

      body {
        font-family: "Inter", sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 40px;
      }

      .api-flow {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
        max-width: 800px;
        margin: 50px 0;
        position: relative;
      }

      .node {
        width: 120px;
        height: 120px;
        background: var(--card);
        border: 2px solid var(--primary);
        border-radius: 15px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        font-size: 0.8rem;
        z-index: 2;
      }

      .node i {
        font-size: 2rem;
        margin-bottom: 10px;
        color: var(--primary);
      }

      /* O "Pacote" de Dados (Animação) */
      .data-packet {
        width: 20px;
        height: 20px;
        background: var(--secondary);
        border-radius: 4px;
        position: absolute;
        top: 50%;
        left: 15%;
        transform: translateY(-50%);
        display: none;
        box-shadow: 0 0 10px var(--secondary);
      }

      @keyframes sendRequest {
        0% {
          left: 15%;
          opacity: 1;
        }
        45% {
          left: 45%;
          opacity: 1;
        }
        50% {
          left: 50%;
          opacity: 0;
        } /* Entrou na API */
        55% {
          left: 55%;
          opacity: 1;
        }
        100% {
          left: 85%;
          opacity: 1;
        }
      }

      @keyframes returnResponse {
        0% {
          left: 85%;
          background: #10b981;
        }
        100% {
          left: 15%;
          background: #10b981;
        }
      }

      .btn-fetch {
        padding: 15px 30px;
        background: var(--primary);
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        transition: 0.3s;
      }

      .btn-fetch:hover {
        transform: scale(1.05);
        background: var(--secondary);
      }

      .json-viewer {
        width: 100%;
        max-width: 600px;
        background: #000;
        padding: 20px;
        border-radius: 8px;
        font-family: "Fira Code", monospace;
        color: #10b981;
        font-size: 0.9rem;
        border: 1px solid #334155;
      }
    </style>
  </head>
  <body>
    <h1>Como uma API funciona?</h1>
    <p>Clique no botão para disparar uma requisição real.</p>

    <div class="api-flow">
      <div class="node">
        <i class="fas fa-laptop-code"></i>
        Frontend<br />(Seu Código)
      </div>

      <div class="node" style="border-color: var(--secondary)">
        <i class="fas fa-server"></i>
        API<br />(A Ponte)
      </div>

      <div class="node">
        <i class="fas fa-database"></i>
        Backend<br />(Dados)
      </div>

      <div id="packet" class="data-packet"></div>
    </div>

    <button class="btn-fetch" onclick="startSim()">Fazer Request (GET)</button>

    <div style="margin-top: 30px; width: 100%; max-width: 600px">
      <label>Resposta do "Servidor" (JSON):</label>
      <div class="json-viewer" id="json-output">
        // Aguardando requisição...
      </div>
    </div>

    <script
      src="https://kit.fontawesome.com/a076d05399.js"
      crossorigin="anonymous"
    ></script>
    <script>
      async function startSim() {
        const packet = document.getElementById("packet");
        const output = document.getElementById("json-output");

        output.innerHTML = "// Enviando GET Request...";
        packet.style.display = "block";
        packet.style.animation = "sendRequest 2s forwards";

        // Simulando o tempo de resposta da rede
        setTimeout(async () => {
          try {
            // Chamando uma API real de exemplo (JSONPlaceholder)
            const response = await fetch(
              "https://jsonplaceholder.typicode.com/posts/1",
            );
            const data = await response.json();

            // Animação de volta
            packet.style.animation = "returnResponse 1.5s forwards";

            setTimeout(() => {
              output.innerHTML = JSON.stringify(data, null, 4);
              packet.style.display = "none";
            }, 1500);
          } catch (error) {
            output.innerHTML = "// Erro na conexão!";
          }
        }, 2000);
      }
    </script>
  </body>
</html>
