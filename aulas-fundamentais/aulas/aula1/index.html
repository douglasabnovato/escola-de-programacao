<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 01 - Fundamentos | ByteClass</title>
    <style>
        /* Reset de Estilo para o Iframe */
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #0f111a; /* Tokyo Night Dark */
            color: #a9b1d6;
            font-family: 'Inter', system-ui, sans-serif;
        }

        .card-aula {
            background: rgba(26, 27, 38, 0.8);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid #24283b;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 300px;
        }

        .avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 3px solid #7aa2f7; /* Azul Nexus */
            margin-bottom: 20px;
            object-fit: cover;
            /* Placeholder de tecnologia do Unsplash */
            background: #16161e;
        }

        h1 {
            color: #7aa2f7;
            font-size: 1.5rem;
            margin: 0 0 10px 0;
        }

        p {
            font-size: 0.9rem;
            line-height: 1.5;
            color: #565f89;
        }

        .tag {
            display: inline-block;
            margin-top: 15px;
            padding: 4px 12px;
            background: #2f334d;
            color: #9ece6a; /* Verde Sucesso */
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.7rem;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <main class="card-aula">
        <img src="https://images.unsplash.com/photo-1587620962725-abab7fe55159?auto=format&fit=crop&q=80&w=500" 
             alt="Tech Environment" 
             class="avatar">
        
        <h1>Aula 01</h1>
        <p>Bem-vindo ao ecossistema <strong>learnTECH</strong>. Hoje iniciamos sua base como desenvolvedor.</p>
        
        <span class="tag">HTML + CSS Fundamental</span>
    </main>

    <script>
        // Log integrado com o Terminal do Nexus
        console.log("✔️ [NEXUS] Aula 01 renderizada via CDN.");
        console.log("Dica: O CSS está isolado dentro deste arquivo único.");
    </script>
</body>
</html>
