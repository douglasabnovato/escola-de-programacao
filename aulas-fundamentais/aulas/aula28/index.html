<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aula 28 - Deploy & Live Hosting | ByteClass</title>
    <style>
      :root {
        --bg: #1a1b26;
        --deploying: #e0af68;
        --live: #9ece6a;
        --text: #a9b1d6;
        --url-bg: #24283b;
      }

      body {
        font-family: "Segoe UI", sans-serif;
        background-color: var(--bg);
        color: var(--text);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
      }

      .deploy-card {
        background: var(--url-bg);
        padding: 30px;
        border-radius: 15px;
        border: 1px solid #414868;
        width: 450px;
        text-align: center;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      }

      .status-badge {
        display: inline-block;
        padding: 5px 15px;
        border-radius: 20px;
        font-size: 0.8rem;
        font-weight: bold;
        text-transform: uppercase;
        margin-bottom: 20px;
        background: var(--deploying);
        color: #1a1b26;
        animation: pulse 1.5s infinite;
      }

      .status-live {
        background: var(--live);
        animation: none;
      }

      .browser-mockup {
        background: #fff;
        border-radius: 8px;
        overflow: hidden;
        margin-top: 20px;
        border: 4px solid #414868;
      }

      .browser-bar {
        background: #e0e0e0;
        padding: 8px;
        display: flex;
        gap: 5px;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #ff5f56;
      }
      .url-input {
        background: #fff;
        flex-grow: 1;
        border-radius: 4px;
        font-size: 0.7rem;
        padding: 2px 10px;
        color: #666;
        text-align: left;
      }

      .site-preview {
        height: 150px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #1a1b26;
        background: linear-gradient(135deg, #7aa2f7, #bb9af7);
        font-weight: bold;
      }

      @keyframes pulse {
        0% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
        100% {
          opacity: 1;
        }
      }

      .log {
        font-family: monospace;
        font-size: 0.75rem;
        text-align: left;
        margin-top: 20px;
        color: #565f89;
      }
    </style>
  </head>
  <body>
    <div class="deploy-card">
      <div id="status" class="status-badge">Building Project...</div>
      <h2>Seu Projeto está Online!</h2>

      <div class="browser-mockup">
        <div class="browser-bar">
          <div class="dot"></div>
          <div class="dot" style="background: #ffbd2e"></div>
          <div class="dot" style="background: #27c93f"></div>
          <div class="url-input" id="url-text">https://loading-project...</div>
        </div>
        <div class="site-preview" id="preview">🚀 Carregando...</div>
      </div>

      <div class="log">
        > Fetching from GitHub...<br />
        > Optimizing assets...<br />
        > <span style="color: var(--live)">Success: Deploy complete!</span>
      </div>
    </div>

    <script>
      setTimeout(() => {
        document.getElementById("status").innerText = "Production Live";
        document.getElementById("status").classList.add("status-live");
        document.getElementById("url-text").innerText =
          "https://learntech-aluno.netlify.app";
        document.getElementById("preview").innerText = "MEU PRIMEIRO DEPLOY!";
        console.log("✅ [DEPLOY-DONE] Projeto publicado com sucesso.");
      }, 3000);
    </script>
  </body>
</html>
