<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ByteClass | Aula 44 - Regex Avançado</title>
    <style>
        :root {
            --bg: #1a1b26; --panel: #24283b; --text: #a9b1d6;
            --accent: #7aa2f7; --success: #9ece6a; --danger: #f7768e;
        }

        body {
            font-family: 'JetBrains Mono', monospace;
            background: var(--bg); color: var(--text);
            padding: 20px; display: flex; flex-direction: column; align-items: center;
        }

        .validator-card {
            background: var(--panel); border: 1px solid #414868;
            padding: 25px; border-radius: 12px; width: 100%; max-width: 600px;
        }

        .input-group { margin-bottom: 20px; }
        label { display: block; font-size: 0.8rem; margin-bottom: 8px; color: var(--accent); }
        
        input {
            width: 100%; padding: 12px; background: #16161e;
            border: 2px solid #414868; color: #fff; border-radius: 6px;
            outline: none; transition: 0.3s;
        }

        .valid { border-color: var(--success) !important; box-shadow: 0 0 10px rgba(158, 206, 106, 0.2); }
        .invalid { border-color: var(--danger) !important; }

        .regex-hint { font-size: 0.7rem; color: #565f89; margin-top: 5px; }
        
        .badge {
            display: inline-block; padding: 2px 8px; border-radius: 4px;
            font-size: 0.7rem; font-weight: bold; margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <h1>Aula 44: Regex Avançado</h1>
    <p>Padrões de Validação para o Ecossistema</p>

    <div class="validator-card">
        <div class="input-group">
            <span class="badge" style="background: var(--accent); color: #1a1b26;">VOLTA EXPRESS</span>
            <label>Placa de Veículo (Modelo Mercosul):</label>
            <input type="text" id="placa" placeholder="ABC1D23" oninput="validar(this, /^[A-Z]{3}[0-9][A-Z0-9][0-9]{2}$/)">
            <div class="regex-hint">Pattern: <code>/^[A-Z]{3}[0-9][A-Z0-9][0-9]{2}$/</code></div>
        </div>

        <div class="input-group">
            <span class="badge" style="background: var(--danger); color: white;">MEDTREM</span>
            <label>ID de Protocolo (Ex: MED-2026-X99):</label>
            <input type="text" id="protocolo" placeholder="MED-YYYY-A00" oninput="validar(this, /^MED-\d{4}-[A-Z]\d{2}$/)">
            <div class="regex-hint">Pattern: <code>/^MED-\d{4}-[A-Z]\d{2}$/</code></div>
        </div>

        <div class="input-group">
            <span class="badge" style="background: var(--success); color: #1a1b26;">NCK LABS</span>
            <label>Senha de Admin (Min. 8 chars, Letra, Nº, Símbolo):</label>
            <input type="password" id="pass" placeholder="********" oninput="validar(this, /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/)">
            <div class="regex-hint">Pattern: <code>Lookaheads Complexos (?=...)</code></div>
        </div>
    </div>

    <script>
        function validar(el, regex) {
            if (regex.test(el.value)) {
                el.classList.add('valid');
                el.classList.remove('invalid');
            } else {
                el.classList.add('invalid');
                el.classList.remove('valid');
            }
            if(el.value === "") el.classList.remove('valid', 'invalid');
        }
    </script>
</body>
</html>
