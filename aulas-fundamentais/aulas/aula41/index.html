<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ByteClass | Aula 41 - Big O Notation</title>
    <style>
        :root {
            --bg: #1a1b26; --panel: #24283b; --text: #a9b1d6;
            --o1: #9ece6a; --on: #7aa2f7; --on2: #f7768e;
        }

        body {
            font-family: 'JetBrains Mono', monospace;
            background: var(--bg); color: var(--text);
            padding: 20px; display: flex; flex-direction: column; align-items: center;
        }

        .chart-area {
            width: 100%; max-width: 700px; height: 300px;
            border-left: 2px solid #414868; border-bottom: 2px solid #414868;
            margin: 40px 0; position: relative; overflow: hidden;
        }

        .line { position: absolute; bottom: 0; left: 0; transform-origin: bottom left; }
        
        /* O(1) - Constante */
        .o1 { width: 100%; height: 2px; background: var(--o1); bottom: 20px; }
        
        /* O(n) - Linear */
        .on { width: 1000px; height: 2px; background: var(--on); transform: rotate(-45deg); }
        
        /* O(n²) - Quadrático */
        .on2 { width: 1000px; height: 4px; background: var(--on2); border-radius: 50%; bottom: -500px; left: -100px; height: 1000px; width: 1000px; border: 2px solid var(--on2); }

        .legend { display: flex; gap: 20px; background: var(--panel); padding: 15px; border-radius: 8px; }
        .legend-item { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; }
        .dot { width: 12px; height: 12px; border-radius: 2px; }

        .simulator { margin-top: 30px; text-align: center; width: 100%; max-width: 600px; }
        input { background: #16161e; border: 1px solid #414868; color: #fff; padding: 10px; width: 100px; }
    </style>
</head>
<body>

    <h1>Aula 41: Complexidade (Big O)</h1>
    <p>Escalabilidade na NCK Labs: O Custo do Processamento</p>

    <div class="chart-area">
        <div class="line o1"></div>
        <div class="line on"></div>
        <div style="position: absolute; bottom: 10px; left: 10px; color: var(--on2); font-weight: bold;">O(n²) -> PERIGO</div>
    </div>

    <div class="legend">
        <div class="legend-item"><div class="dot" style="background: var(--o1)"></div> O(1) Constante</div>
        <div class="legend-item"><div class="dot" style="background: var(--on)"></div> O(n) Linear</div>
        <div class="legend-item"><div class="dot" style="background: var(--on2)"></div> O(n²) Quadrático</div>
    </div>

    <div class="simulator">
        <label>Quantidade de Dados (n):</label>
        <input type="number" id="data-n" value="1000" oninput="calcular()">
        <div id="results" style="margin-top: 20px; text-align: left; font-size: 0.9rem; line-height: 2;">
            </div>
    </div>

    <script>
        function calcular() {
            const n = document.getElementById('data-n').value;
            const res = document.getElementById('results');
            
            res.innerHTML = `
                <span style="color: var(--o1)">● O(1):</span> Sempre 1 operação (Ex: Acessar índice de Array).<br>
                <span style="color: var(--on)">● O(n):</span> ${Number(n).toLocaleString()} operações (Ex: Busca simples).<br>
                <span style="color: var(--on2)">● O(n²):</span> ${Math.pow(n, 2).toLocaleString()} operações (Ex: Bubble Sort). ⚠️
            `;
        }
        calcular();
    </script>
</body>
</html>
