<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Computer Science in the World | MediaFlow Nexus</title>
  
  <link rel="stylesheet" href="style.css">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <header class="app-header">
    <div class="brand">
      <div class="logo-placeholder">
        <i class="fas fa-play-circle"></i>
      </div>
      <h1>CS<span>World</span> | MediaFlow Nexus</h1>
    </div>
    <div class="header-badge">
      <span>BU: Educação</span>
    </div>
  </header>

  <main class="workspace-container">
    
    <section class="player-zone">
      <div class="player-wrapper" id="player-container">
        <div class="player-placeholder">
          <i class="fas fa-play"></i>
          <p>Selecione um vídeo na playlist para iniciar</p>
        </div>
      </div>
      
      <div class="media-details">
        <h2 id="active-title">Aguardando seleção...</h2>
        <div class="media-meta">
          <span id="active-channel"><i class="fas fa-graduation-cap"></i> --</span>
          <span id="active-duration"><i class="far fa-clock"></i> --:--</span>
        </div>
      </div>
    </section>

    <section class="playlist-zone">
      <div class="playlist-header">
        <h3>Fila de Reprodução</h3>
        <span class="badge-count" id="video-count">0 vídeos</span>
      </div>
      
      <div class="playlist-scroll-area" id="playlist-cards">
        
        </div>
    </section>

  </main>

  <footer class="app-footer">
    <p>© 2026 <strong>ByteClass / learnTECH</strong> – Transformando linhas de código em experiências imersivas.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
