<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aulas Fundamentais | ByteClass</title>
    <link rel="stylesheet" href="style.css">
    <link id="dynamic-css" rel="stylesheet" href="">
</head>
<body>
 <div class="nexus-wrapper">
    <aside class="nexus-sidebar">
        <div class="sidebar-brand">
            <div class="brand-logo">N</div>
            <div class="brand-text">
                <span class="main">NEXUS</span>
                <span class="sub">byteclass_system</span>
            </div>
        </div>

        <nav class="sidebar-nav">
            <div class="nav-group">
                <header>PLATAFORMA</header>
                <ul class="nav-list">
                    <li class="nav-item highlight" onclick="navegar('dashboard')">
                        <i class="icon">📊</i> <span>Dashboard</span>
                    </li>
                </ul>
            </div>

            <div class="nav-group">
                <header>DESAFIOS JS</header>
                <ul class="scrollable-list" id="challenge-menu">
                    <script>
                        for (let i = 1; i <= 54; i++) {
                            const num = i.toString().padStart(2, '0');
                            document.write(`
                                <li class="nav-item" id="menu-desafio-${i}" onclick="carregarDesafio(${i})">
                                    <i class="icon">λ</i> <span>Aula ${num}</span>
                                </li>
                            `);
                        }
                    </script>
                </ul>
            </div>
        </nav>

        <footer class="sidebar-footer">
            <div class="bu-indicator">
                <span class="status-dot"></span>
                <span id="current-bu">BU: EDUCATION</span>
            </div>
        </footer>
    </aside>

    <main class="nexus-main">
        <header class="main-header">
            <div class="path-info">
                <span class="root">workspace</span>
                <span class="sep">/</span>
                <span class="active-file" id="file-breadcrumb">init.js</span>
            </div>
            <div class="header-actions">
                <button class="btn btn-secondary" onclick="limparTerminal()">RESET</button>
                <button class="btn btn-primary" id="btn-run" disabled>RUN_SCRIPT</button>
            </div>
        </header>

        <section class="execution-area">
    <div class="code-viewer-container">
        <div class="terminal-bar">SOURCE_CODE: <span id="source-name">init.js</span></div>
        <pre class="code-display"><code id="code-content">// Selecione um desafio para visualizar o código...</code></pre>
    </div>

    <div class="terminal-container">
    <div class="terminal-bar">LIVE_PREVIEW / EXECUÇÃO</div>
    <div id="output-display" class="terminal-body" style="padding: 0; overflow: hidden;">
        <iframe id="nexus-preview" style="width: 100%; height: 100%; border: none;"></iframe>
    </div>
</div>

</section>
    </main>

    <section class="nexus-inspector">
        <div class="inspector-header">
            <h3 id="view-title">INSPECTOR</h3>
        </div>
        <div class="inspector-content">
            <div class="info-card">
                <label>DOCUMENTAÇÃO</label>
                <div id="explanation-text">
                    <p>Selecione um desafio para carregar os requisitos.</p>
                </div>
            </div>
            <div class="info-card">
                <label>METADADOS</label>
                <div class="meta-grid">
                    <span>Level:</span> <span class="val" id="meta-level">-</span>
                    <span>Track:</span> <span class="val">Frontend</span>
                </div>
            </div>
        </div>
    </section>
</div>

    <script src="./aulas_config.js"></script>
    <script src="./main.js"></script>
    <script id="dynamic-script"></script>
</body>
</html>
