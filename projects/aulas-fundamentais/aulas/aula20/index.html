<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokédex Retro | ByteClass Aula 20</title>
    <style>
      /* CSS ART - DESENHANDO A POKÉDEX */
      @import url("https://fonts.googleapis.com/css2?family=Oxanium:wght@300;400;500;600;700;800&display=swap");

      :root {
        --pokedex-red: #c00d0d;
        --pokedex-dark: #8b0000;
        --screen-bg: #78c850;
        --button-dark: #333;
        --font-main: "Oxanium", cursive;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: var(--font-main);
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: linear-gradient(180deg, #6ab7f5 0%, #fff 100%);
      }

      /* CORPO DA POKEDEX */
      .pokedex {
        width: 360px;
        height: 560px;
        background-color: var(--pokedex-red);
        border: 4px solid #000;
        border-radius: 10px 10px 10px 60px;
        position: relative;
        box-shadow: -12px 12px 0 rgba(0, 0, 0, 0.2);
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      /* LUZES DO TOPO */
      .header-lights {
        align-self: flex-start;
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
      }

      .light-blue {
        width: 50px;
        height: 50px;
        background: radial-gradient(circle, #00f2ff, #0077ff);
        border: 4px solid white;
        border-radius: 50%;
        box-shadow: 0 0 15px #00f2ff;
      }

      .mini-light {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        border: 1px solid #000;
      }
      .red {
        background: #ff0000;
      }
      .yellow {
        background: #fbff00;
      }
      .green {
        background: #00ff11;
      }

      /* TELA */
      .screen-border {
        width: 100%;
        height: 220px;
        background: #ddd;
        border: 3px solid #333;
        border-radius: 10px 10px 10px 40px;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        overflow: hidden;
        background-image: linear-gradient(
          to bottom,
          #87ceeb 50%,
          var(--screen-bg) 50%
        );
      }

      .pokemon__image {
        height: 110px;
        z-index: 2;
        filter: drop-shadow(2px 2px 0 rgba(0, 0, 0, 0.1));
      }

      /* DISPLAY DE DADOS */
      .pokemon__data {
        margin-top: 15px;
        color: #333;
        font-size: 1.3rem;
        text-align: center;
        min-height: 1.5em;
      }

      .pokemon__name {
        text-transform: capitalize;
        font-weight: 700;
      }

      /* FORMULÁRIO DE BUSCA */
      .form {
        width: 90%;
        margin: 20px 0;
      }

      .input__search {
        width: 100%;
        padding: 12px;
        border: 3px solid #333;
        border-radius: 8px;
        outline: none;
        font-size: 1rem;
        font-weight: 600;
        box-shadow: -4px 4px 0 #333;
      }

      /* BOTÕES DE NAVEGAÇÃO */
      .buttons {
        display: flex;
        width: 90%;
        gap: 15px;
      }

      .button {
        flex: 1;
        padding: 15px;
        background-color: var(--button-dark);
        color: white;
        border: 2px solid #000;
        border-radius: 8px;
        font-weight: bold;
        cursor: pointer;
        box-shadow: -3px 3px 0 #000;
        transition: 0.1s;
      }

      .button:active {
        box-shadow: 0 0 0;
        transform: translate(-3px, 3px);
      }

      /* DECORAÇÃO LATERAL */
      .pokedex::after {
        content: "";
        position: absolute;
        right: -25px;
        top: 50px;
        width: 25px;
        height: 400px;
        background: var(--pokedex-dark);
        border: 4px solid #000;
        border-left: none;
        border-radius: 0 15px 15px 0;
      }
    </style>
  </head>
  <body>
    <main class="pokedex">
      <div class="header-lights">
        <div class="light-blue"></div>
        <div class="mini-light red"></div>
        <div class="mini-light yellow"></div>
        <div class="mini-light green"></div>
      </div>

      <div class="screen-border">
        <img class="pokemon__image" src="#" alt="pokemon" />
      </div>

      <h1 class="pokemon__data">
        <span class="pokemon__number"></span> -
        <span class="pokemon__name"></span>
      </h1>

      <form class="form">
        <input
          type="search"
          class="input__search"
          placeholder="Nome ou Número"
          required
        />
      </form>

      <div class="buttons">
        <button class="button btn-prev">Anterior</button>
        <button class="button btn-next">Próximo</button>
      </div>
    </main>

    <script>
      const pokemonName = document.querySelector(".pokemon__name");
      const pokemonNumber = document.querySelector(".pokemon__number");
      const pokemonImage = document.querySelector(".pokemon__image");

      const form = document.querySelector(".form");
      const input = document.querySelector(".input__search");
      const buttonPrev = document.querySelector(".btn-prev");
      const buttonNext = document.querySelector(".btn-next");

      let searchPokemon = 1;

      // FETCH API - Lógica Assíncrona
      const fetchPokemon = async (pokemon) => {
        const APIResponse = await fetch(
          `https://pokeapi.co/api/v2/pokemon/${pokemon}`,
        );

        if (APIResponse.status === 200) {
          const data = await APIResponse.json();
          return data;
        }
      };

      // RENDERIZAÇÃO
      const renderPokemon = async (pokemon) => {
        pokemonName.innerHTML = "Carregando...";
        pokemonNumber.innerHTML = "";

        const data = await fetchPokemon(pokemon);

        if (data) {
          pokemonImage.style.display = "block";
          pokemonName.innerHTML = data.name;
          pokemonNumber.innerHTML = data.id;

          // Caminho para o sprite animado (Geração 5)
          pokemonImage.src =
            data["sprites"]["versions"]["generation-v"]["black-white"][
              "animated"
            ]["front_default"];

          input.value = "";
          searchPokemon = data.id;
        } else {
          pokemonImage.style.display = "none";
          pokemonName.innerHTML = "Não encontrado";
          pokemonNumber.innerHTML = "???";
        }
      };

      // EVENTOS
      form.addEventListener("submit", (event) => {
        event.preventDefault();
        renderPokemon(input.value.toLowerCase());
      });

      buttonPrev.addEventListener("click", () => {
        if (searchPokemon > 1) {
          searchPokemon -= 1;
          renderPokemon(searchPokemon);
        }
      });

      buttonNext.addEventListener("click", () => {
        searchPokemon += 1;
        renderPokemon(searchPokemon);
      });

      // Inicialização
      renderPokemon(searchPokemon);
    </script>
  </body>
</html>
