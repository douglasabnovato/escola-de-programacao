<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 05 - Arrays e Iteração | ByteClass</title>
    <style>
        /* Nexus Design System - Tokyo Night */
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #0f111a;
            color: #a9b1d6;
            font-family: 'Inter', sans-serif;
        }

        .array-card {
            background: rgba(26, 27, 38, 0.9);
            padding: 25px;
            border-radius: 12px;
            border-right: 4px solid #ff9e64; /* Laranja Nexus para Dados/Arrays */
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            width: 90%;
            max-width: 400px;
        }

        h1 { color: #ff9e64; font-size: 1.3rem; margin-bottom: 15px; }
        
        .data-viewer {
            background: #16161e;
            padding: 15px;
            border-radius: 6px;
            font-family: 'Fira Code', monospace;
            font-size: 0.9rem;
            border: 1px solid #24283b;
            margin: 15px 0;
            min-height: 80px;
            color: #73daca;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        button {
            background: #2f334d;
            color: #ff9e64;
            border: 1px solid #ff9e64;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.8rem;
            transition: 0.2s;
        }

        button:hover {
            background: #ff9e64;
            color: #0f111a;
        }

        .label { color: #565f89; font-size: 0.75rem; text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="array-card">
        <h1>Manipulação de Arrays</h1>
        <span class="label">Lista Atual:</span>
        <div class="data-viewer" id="array-display">[ 1, 2, 3 ]</div>
        
        <div class="controls">
            <button onclick="rodarLoopFor()">Loop For (+5)</button>
            <button onclick="rodarForEach()">Rodar forEach</button>
        </div>
    </div>

    <script>
        // --- Estado Inicial ---
        let numeros = [1, 2, 3];
        const display = document.getElementById('array-display');

        // 1. Loop Tradicional (Transformação)
        function rodarLoopFor() {
            console.log("[SISTEMA] Iniciando Loop For...");
            // Criamos uma cópia para não perder a referência original em testes repetidos
            let tempNumeros = [...numeros]; 
            
            for (let i = 0; i < tempNumeros.length; i++) {
                tempNumeros[i] = tempNumeros[i] + 5;
                console.log(`Passo ${i+1}:`, tempNumeros);
            }
            
            display.innerText = `[ ${tempNumeros.join(", ")} ]`;
            display.style.color = "#bb9af7"; // Roxo para indicar mudança
        }

        // 2. forEach Moderno (Iteração)
        function rodarForEach() {
            console.log("[SISTEMA] Executando forEach...");
            display.innerText = "";
            
            // Exemplo 1: Logando números
            numeros.forEach((num) => {
                console.log("Número:", num);
                display.innerText += `Item: ${num} \n`;
            });

            // Exemplo 2: O seu "Hello" do código
            numeros.forEach(() => {
                console.log("hello");
            });

            display.style.color = "#73daca"; // Verde
        }
    </script>
</body>
</html>
