<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ByteClass | Aula 48 - JSON & Persistência</title>
    <style>
        :root {
            --bg: #1a1b26; --panel: #24283b; --text: #a9b1d6;
            --json-key: #7aa2f7; --json-val: #9ece6a; --accent: #bb9af7;
        }

        body {
            font-family: 'JetBrains Mono', monospace;
            background: var(--bg); color: var(--text);
            padding: 20px; display: flex; flex-direction: column; align-items: center;
        }

        .storage-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
            width: 100%; max-width: 900px; margin-top: 20px;
        }

        .card { background: var(--panel); padding: 20px; border-radius: 8px; border: 1px solid #414868; }

        textarea {
            width: 100%; height: 120px; background: #16161e; color: var(--json-val);
            border: 1px solid #414868; padding: 10px; font-family: inherit; font-size: 0.8rem;
        }

        .storage-view {
            background: #16161e; padding: 15px; border-radius: 4px; min-height: 100px;
            font-size: 0.75rem; word-break: break-all; color: var(--json-key);
        }

        button {
            width: 100%; padding: 12px; margin-top: 10px; cursor: pointer;
            border: none; border-radius: 4px; font-weight: bold;
            background: var(--accent); color: #1a1b26;
        }

        .badge { font-size: 0.7rem; padding: 3px 7px; border-radius: 3px; background: #414868; }
    </style>
</head>
<body>

    <h1>Aula 48: JSON & Persistência</h1>
    <p>Salvando o Estado da Volta Express no Navegador</p>

    <div class="storage-grid">
        <div class="card">
            <h3>📝 Cadastro de Carga</h3>
            <label><small>ID da Carga:</small></label>
            <input type="text" id="carga-id" placeholder="VLT-99" style="width:90%; margin-bottom:10px; padding:5px;">
            <label><small>Descrição:</small></label>
            <textarea id="carga-desc" placeholder='{"item": "Eletrônicos", "peso": 450}'></textarea>
            <button onclick="salvarCarga()">Serializar e Salvar (JSON.stringify)</button>
        </div>

        <div class="card">
            <h3>📦 LocalStorage <span class="badge">Navegador</span></h3>
            <div id="storage-display" class="storage-view">
                // Sem dados persistidos...
            </div>
            <button onclick="carregarCarga()" style="background: var(--json-val);">Desserializar (JSON.parse)</button>
            <button onclick="limpar()" style="background: #f7768e; margin-top:5px;">Limpar Tudo</button>
        </div>
    </div>

    <script>
        function salvarCarga() {
            const id = document.getElementById('carga-id').value;
            const descRaw = document.getElementById('carga-desc').value;

            try {
                // Simulando um objeto complexo
                const objetoCarga = {
                    id: id,
                    detalhes: JSON.parse(descRaw),
                    timestamp: new Date().toISOString()
                };

                // PERSISTÊNCIA: Objeto -> String
                const jsonString = JSON.stringify(objetoCarga);
                localStorage.setItem('ultima_carga', jsonString);
                
                renderStorage();
                alert("Dados persistidos com sucesso!");
            } catch (e) {
                alert("Erro no formato JSON: " + e.message);
            }
        }

        function carregarCarga() {
            const raw = localStorage.getItem('ultima_carga');
            if(!raw) return alert("Nada encontrado!");

            // RECUPERAÇÃO: String -> Objeto
            const objeto = JSON.parse(raw);
            alert(`Carga Recuperada: ${objeto.id} - ${objeto.detalhes.item}`);
            console.log("Objeto Vivo:", objeto);
        }

        function renderStorage() {
            const raw = localStorage.getItem('ultima_carga');
            document.getElementById('storage-display').innerText = raw || "// Vazio";
        }

        function limpar() {
            localStorage.clear();
            renderStorage();
        }

        renderStorage();
    </script>
</body>
</html>
