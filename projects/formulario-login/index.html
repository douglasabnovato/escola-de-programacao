<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Nexus Hub</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Roboto:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <style>
      /* ==========================================================================
           DESIGN SYSTEM NEXUS (ADAPTADO)
           ========================================================================== */
      :root {
        --primary: #ff5722;
        --bg: #080808;
        --surface: #121212;
        --text: #f0f0f0;
        --error: #ff4444;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background-color: var(--bg);
        font-family: "Inter", sans-serif;
        height: 100vh;
        width: 100vw;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        color: var(--text);
      }

      /* CONTAINER PRINCIPAL */
      section {
        position: relative;
        z-index: 10;
        text-align: center;
        width: 100%;
        max-width: 400px;
        padding: 20px;
      }

      h1 {
        font-size: 28px;
        margin-bottom: 25px;
        letter-spacing: -1px;
        color: var(--text);
      }

      /* FORMULÁRIO NEXUS STYLE */
      form {
        background-color: var(--surface);
        padding: 40px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.05);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        animation: fade 0.4s ease-out;
      }

      .input-block {
        margin-bottom: 25px;
        text-align: left;
      }

      .input-block label {
        display: block;
        font-size: 13px;
        color: #888;
        margin-bottom: 8px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .input-block input {
        width: 100%;
        padding: 12px;
        background: var(--bg);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 6px;
        color: white;
        font-size: 16px;
        outline: none;
        transition: 0.3s;
      }

      .input-block input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 10px rgba(255, 87, 34, 0.2);
      }

      .btn-login {
        width: 100%;
        padding: 14px;
        background-color: var(--primary);
        color: white;
        border: none;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.3s;
        margin-top: 10px;
      }

      .btn-login:hover {
        filter: brightness(1.1);
        transform: translateY(-2px);
      }

      /* ANIMAÇÕES DE ESTADO */
      .form-hide {
        animation: down 0.8s forwards cubic-bezier(0.075, 0.82, 0.165, 1);
      }

      form.validate-error {
        animation: nono 250ms linear;
        animation-iteration-count: 2;
        border-color: var(--error);
      }

      @keyframes nono {
        0%,
        100% {
          transform: translateX(0);
        }
        25% {
          transform: translateX(-8px);
        }
        75% {
          transform: translateX(8px);
        }
      }

      @keyframes down {
        to {
          transform: translateY(100vh);
          opacity: 0;
        }
      }

      @keyframes fade {
        from {
          opacity: 0;
          transform: scale(0.9);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      /* SQUARES ANIMATION */
      .squares {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        z-index: 1;
        pointer-events: none;
      }

      .squares li {
        position: absolute;
        list-style: none;
        background-color: rgba(255, 87, 34, 0.1); /* Laranja suave */
        bottom: -150px;
        animation: up infinite alternate;
      }

      @keyframes up {
        from {
          opacity: 0;
          transform: translateY(0);
        }
        50% {
          opacity: 0.4;
        }
        to {
          opacity: 0;
          transform: translateY(-1000px) rotate(720deg);
        }
      }
    </style>
  </head>
  <body>
    <ul class="squares" id="squares"></ul>

    <section>
      <h1>Entrar no Nexus</h1>
      <form id="login-form">
        <div class="input-block">
          <label for="login-email">Email</label>
          <input
            type="email"
            id="login-email"
            placeholder="dev@learntech.com"
          />
        </div>
        <div class="input-block">
          <label for="login-password">Senha</label>
          <input type="password" id="login-password" placeholder="••••••••" />
        </div>
        <button type="submit" class="btn-login">Acessar Foguete</button>
      </form>
    </section>

    <script>
      const form = document.getElementById("login-form");
      const squaresContainer = document.getElementById("squares");

      // Lógica de validação e animação
      form.addEventListener("submit", (event) => {
        event.preventDefault();

        const email = document.getElementById("login-email").value;
        const pass = document.getElementById("login-password").value;

        if (email === "" || pass === "") {
          form.classList.add("validate-error");
        } else {
          form.classList.add("form-hide");
          setTimeout(() => {
            alert("Acesso autorizado! Bem-vindo ao Nexus.");
            // Aqui você poderia redirecionar: window.location.href = "../index.html";
          }, 800);
        }
      });

      form.addEventListener("animationend", (event) => {
        if (event.animationName === "nono") {
          form.classList.remove("validate-error");
        }
      });

      // Gerador de quadrados dinâmicos
      for (let i = 0; i < 25; i++) {
        const li = document.createElement("li");
        const random = (min, max) => Math.random() * (max - min) + min;

        const size = Math.floor(random(20, 100));
        const position = random(1, 99);
        const delay = random(0.1, 5);
        const duration = random(10, 25);

        li.style.width = `${size}px`;
        li.style.height = `${size}px`;
        li.style.left = `${position}%`;
        li.style.animationDelay = `${delay}s`;
        li.style.animationDuration = `${duration}s`;
        li.style.borderRadius = "4px";

        squaresContainer.appendChild(li);
      }
    </script>
  </body>
</html>
